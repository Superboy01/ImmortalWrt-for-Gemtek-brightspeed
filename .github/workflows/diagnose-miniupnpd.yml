name: Diagnose miniupnpd build failure

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup build environment
        run: |
          sudo apt update
          sudo apt install -y build-essential clang gcc g++ binutils bzip2 gawk gettext git libncurses-dev libssl-dev python3 python3-setuptools rsync unzip wget xsltproc zlib1g-dev file which perl sed make

      - name: Install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          bash scripts/fix-stale-golang-host.sh

      - name: Apply feed patches
        run: FEED_PATCHES_STRICT=1 bash scripts/apply-feed-patches.sh

      - name: Configure
        run: |
          cp 1710.config .config
          make defconfig
          if grep -q '^CONFIG_PACKAGE_airoha-an7581-mt7996-board=' .config; then
            sed -i 's|^CONFIG_PACKAGE_airoha-an7581-mt7996-board=.*|CONFIG_PACKAGE_airoha-an7581-mt7996-board=y|' .config
          else
            echo 'CONFIG_PACKAGE_airoha-an7581-mt7996-board=y' >> .config
          fi

      - name: Download sources
        run: make download -j$(nproc)

      - name: Build tools, toolchain and target
        run: make -j$(nproc) tools/install toolchain/install target/compile 2>&1 | tail -40

      - name: Compile miniupnpd with V=s (hardcoded path, no parsing)
        shell: bash
        run: |
          set +e
          make package/feeds/packages/miniupnpd/compile V=s -j1 2>&1 | tee miniupnpd.log
          echo "================ 关键错误（带上下文）================"
          grep -nE -B5 -A20 "error:|Error [0-9]|FAILED|Patch failed|No rule to make target|undeclared|not found|implicit declaration" miniupnpd.log | head -250 || true
          echo "================ 日志末尾 200 行 ================"
          tail -200 miniupnpd.log || true
          {
            echo "### miniupnpd 编译诊断"
            echo '```'
            grep -nE -B5 -A20 "error:|Error [0-9]|FAILED|Patch failed|No rule to make target|undeclared" miniupnpd.log | head -250
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Upload diagnostic log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: miniupnpd-diagnose-log
          path: miniupnpd.log
          retention-days: 30
