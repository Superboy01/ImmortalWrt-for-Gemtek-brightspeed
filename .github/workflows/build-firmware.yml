name: Build Firmware

on:
  workflow_dispatch:
    inputs:
      config_seed:
        description: 'Build config'
        required: true
        default: '1710.config'
        type: choice
        options:
          - 1710.config
          - 2010.config
          - 2010-2g.config
      release_type:
        description: 'Release Type'
        required: true
        default: 'none'
        type: choice
        options:
          - none
          - release
          - prerelease
      release_notes:
        description: 'Release Notes'
        required: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Generate build version
        id: version
        run: |
          git remote add upstream https://github.com/immortalwrt/immortalwrt.git 2>/dev/null || true
          git remote set-url upstream https://github.com/immortalwrt/immortalwrt.git
          git fetch --no-tags upstream master

          build_date=$(TZ=Asia/Shanghai date +'%Y%m%d')
          repo_commit=$(git rev-parse --short=8 HEAD)
          upstream_base=$(git merge-base HEAD upstream/master)
          upstream_commit=$(git rev-parse --short=8 "$upstream_base")
          build_id="${build_date}-${repo_commit}-${upstream_commit}"
          version_number="${build_date}-${repo_commit}"
          version_code="${build_id}"

          echo "date=$build_date" >> $GITHUB_OUTPUT
          echo "build_id=$build_id" >> $GITHUB_OUTPUT
          echo "repo_commit=$repo_commit" >> $GITHUB_OUTPUT
          echo "upstream_commit=$upstream_commit" >> $GITHUB_OUTPUT
          echo "version_number=$version_number" >> $GITHUB_OUTPUT
          echo "version_code=$version_code" >> $GITHUB_OUTPUT
          case '${{ inputs.config_seed }}' in
            1710.config) device_model=XR1710G ;;
            2010.config) device_model=XG2010G ;;
            2010-2g.config) device_model=XG2010G-2G ;;
            *) echo "Unsupported config seed: ${{ inputs.config_seed }}" >&2; exit 1 ;;
          esac
          echo "device_model=$device_model" >> $GITHUB_OUTPUT
          echo "Build version: ImmortalWrt-for-Gemtek-brightspeed $device_model $version_number"

      - name: Setup build environment
        run: |
          sudo apt update
          sudo apt install -y build-essential clang gcc g++ binutils bzip2 gawk gettext git libncurses-dev libssl-dev python3 python3-setuptools rsync unzip wget xsltproc zlib1g-dev file which perl sed make

      - name: Install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          bash scripts/fix-stale-golang-host.sh
          # miniupnpd 补丁已由上游修复，无需再手动删除：
          # immortalwrt/packages 2026-10-20 commit e765fb88 "miniupnpd: refresh patches"
          #   - 删除 020-descr-filter-fix.patch、030-allow-private-fix.patch（已被 2.3.11 吸收）
          #   - 刷新 010-upnp-igdv2-compat / 040-improve-logging / 900-format-xml 的上下文
          # 已实测这 3 个补丁按 quilt 顺序可全部应用（详见指南 10.14）

          # ── 修复：naoki66 主树缺失 package/libs/libffi ──────────────────
          # immortalwrt/packages 的 lang/python/python3 无条件使用
          # --with-system-ffi（编译 _ctypes 需要 <ffi.h>），HOST_BUILD_DEPENDS
          # 还含 libffi/host；但本仓库主树的 package/libs 只有 48 项，
          # 相比 immortalwrt 官方的 49 项恰好只缺 libffi 一项，
          # 于是 python3 编译时找不到 ffi.h 而失败。
          # 优先取与本仓库基线一致的 immortalwrt 快照版本，失败再回退 master。
          if [ ! -f package/libs/libffi/Makefile ]; then
            mkdir -p package/libs/libffi
            git show '${{ steps.version.outputs.upstream_commit }}:package/libs/libffi/Makefile' \
              > package/libs/libffi/Makefile 2>/dev/null || true
            if [ ! -s package/libs/libffi/Makefile ]; then
              curl -fsSL -o package/libs/libffi/Makefile \
                https://raw.githubusercontent.com/immortalwrt/immortalwrt/master/package/libs/libffi/Makefile
            fi
            echo "--- 补回的 libffi 版本 ---"
            grep -E '^PKG_(VERSION|RELEASE):=' package/libs/libffi/Makefile || true
          fi

          # 强制让 python3 依赖 libffi：python3-base 与 python3-light 是
          # 所有 python3 变体的公共基底，给它们加 +libffi 可同时保证
          # ① libffi 被 defconfig 自动选中 ② libffi 先于 python3 编译
          python3_mk=feeds/packages/lang/python/python3/Makefile
          if [ -f "$python3_mk" ] && ! grep -q '+libffi' "$python3_mk"; then
            sed -i \
              -e 's|^  DEPENDS:=+libpthread \$(ATOMIC64_DEPENDS)|& +libffi|' \
              -e 's|^  DEPENDS:=+python3-base +libbz2 +zlib +libzstd|& +libffi|' \
              "$python3_mk"
            echo "--- 修补后的 python3 依赖 ---"
            grep -nE '^  DEPENDS:=|^HOST_BUILD_DEPENDS' "$python3_mk"
          fi

      - name: Apply feed patches
        run: FEED_PATCHES_STRICT=1 bash scripts/apply-feed-patches.sh

      - name: Configure
        run: |
          cp '${{ inputs.config_seed }}' .config
          BUILD_DATE='${{ steps.version.outputs.date }}' \
          BUILD_ID='${{ steps.version.outputs.build_id }}' \
          REPO_COMMIT='${{ steps.version.outputs.repo_commit }}' \
          UPSTREAM_COMMIT='${{ steps.version.outputs.upstream_commit }}' \
          VERSION_CODE='${{ steps.version.outputs.version_code }}' \
          bash scripts/set-build-version.sh .config
          make defconfig
          # ── 诊断：python3 是谁拉进来的（纯打印，零风险）────────────────
          echo "=== .config 中 python3 / libffi 相关项 ==="
          grep -E '^CONFIG_PACKAGE_(python3|libffi)' .config || echo '(无 python3/libffi 配置项)'
          echo "=== 声明依赖 python3 的 feed 包（最多 20 条）==="
          grep -rn --include=Makefile -E '\+python3(-light|-base)?\b' feeds/ 2>/dev/null | head -20 || true
          # ── 兜底：确保 libffi 一定进入编译（staging 头文件就位）────────
          if ! grep -q '^CONFIG_PACKAGE_libffi=y' .config; then
            echo 'CONFIG_PACKAGE_libffi=y' >> .config
            echo '(已兜底追加 CONFIG_PACKAGE_libffi=y)'
          fi
          # ── 修复上游自检死结 ──────────────────────────────────────────
          # package/network/config/airoha-an7581-mt7996-board 声明了 HIDDEN:=1，
          # 隐藏包生成的 Kconfig 符号没有 prompt，.config 里写什么都会被丢弃重算；
          # TARGET_PER_DEVICE_ROOTFS=y 下它只能算成 =m，而自检脚本要求精确 =y。
          # 此处强制写回 =y。
          if grep -q '^CONFIG_PACKAGE_airoha-an7581-mt7996-board=' .config; then
            sed -i 's|^CONFIG_PACKAGE_airoha-an7581-mt7996-board=.*|CONFIG_PACKAGE_airoha-an7581-mt7996-board=y|' .config
          else
            echo 'CONFIG_PACKAGE_airoha-an7581-mt7996-board=y' >> .config
          fi
          # ─────────────────────────────────────────────────────────────
          bash scripts/check-gemtek-profile-isolation.sh --config .config
          grep -E 'CONFIG_(IMAGEOPT|EXTRA_IMAGE_NAME|VERSIONOPT|VERSION_DIST|VERSION_NUMBER|VERSION_CODE|VERSION_FILENAMES|VERSION_CODE_FILENAMES)[= ]' .config

      - name: Download sources
        run: make download -j$(nproc)

      - name: Build Firmware
        shell: bash
        run: |
          make -j2 world 2>&1 | tee build.log

      - name: Verbose retry on build failure
        if: failure()
        shell: bash
        run: |
          set +e
          # 从 build.log 的 ERROR 行里直接提取 "package/..."（不用 sed，避免转义问题）
          err_line=$(grep -m1 'failed to build' build.log || true)
          failed_pkg=$(printf '%s\n' "$err_line" | grep -oE 'package/[A-Za-z0-9_./-]+' | head -1 || true)
          if [ -z "$failed_pkg" ]; then
            echo "未能从 build.log 识别失败包，打印末尾 200 行"
            tail -200 build.log | tee build-verbose.log
          else
            echo "识别到失败包: $failed_pkg"
            echo "=== 以 V=s -j1 重新编译 $failed_pkg ==="
            make "$failed_pkg/compile" V=s -j1 2>&1 | tee build-verbose.log
            echo "=== 失败包在 build.log 中的上下文 ==="
            grep -nE -B5 -A10 "ERROR:.*$(basename "$failed_pkg")" build.log | head -60 || true
          fi
          echo "=== 关键错误（带上下文，最多 200 行）==="
          grep -nE -B5 -A20 "error:|Error [0-9]|FAILED|Patch failed|No rule to make target|undeclared|not found|implicit declaration" build-verbose.log | head -200 || true
          echo "=== build-verbose.log 末尾 150 行 ==="
          tail -150 build-verbose.log || true
          # 同步写入 Summary 页
          {
            echo "### 编译失败诊断：${failed_pkg:-未识别}"
            echo
            echo '```'
            grep -nE -B5 -A20 "error:|Error [0-9]|FAILED|Patch failed|No rule to make target|undeclared" build-verbose.log 2>/dev/null | head -200
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Verify device isolation
        shell: bash
        run: |
          bash scripts/check-firmware-artifacts.sh \
            --config .config \
            --directory bin/targets/airoha/an7581
          # 精确锁定真正的主内核配置（避免命中 backports 的 CPTCFG_ 配置）
          kernel_config=$(find build_dir/target-aarch64_cortex-a53_musl/linux-airoha_an7581 \
            -maxdepth 2 -path '*linux-*/.config' -print -quit)
          manifest=$(find bin/targets/airoha/an7581 -maxdepth 1 -type f -name '*manifest' -print -quit)
          test -n "$kernel_config"
          test -n "$manifest"
          echo "=== built kernel config: $kernel_config ==="
          echo "--- AIROHA 相关符号 ---"
          grep -E 'AIROHA' "$kernel_config" || echo '(no AIROHA lines in built kernel config!)'
          kernel_override=$(find build_dir/target-aarch64_cortex-a53_musl/linux-airoha_an7581 \
            -maxdepth 2 -path '*linux-*/.config.override' -print -quit)
          echo "--- .config.override：$kernel_override ---"
          if [ -n "$kernel_override" ]; then
            grep -E 'AIROHA' "$kernel_override" || echo '(no AIROHA lines in override)'
          fi
          kernel_target=$(find build_dir/target-aarch64_cortex-a53_musl/linux-airoha_an7581 \
            -maxdepth 2 -path '*linux-*/.config.target' -print -quit)
          echo "--- .config.target：$kernel_target ---"
          if [ -n "$kernel_target" ]; then
            grep -E 'NET_VENDOR_AIROHA|NET_AIROHA' "$kernel_target" || echo '(no NET_AIROHA lines in target)'
          fi
          bash scripts/check-gemtek-profile-isolation.sh \
            --config .config \
            --kernel-config "$kernel_config" \
            --manifest "$manifest"

      - name: Check build status
        if: always()
        run: |
          if [ -f build.log ]; then
            bash scripts/summarize-build-errors.sh build.log || true
            tail -100 build.log
          fi
          echo "=== List all files in bin/targets/airoha/an7581/ ==="
          ls -la bin/targets/airoha/an7581/ 2>/dev/null || echo "No files found in an7581 directory"
          echo "=== List all files in bin/targets/airoha/ ==="
          ls -la bin/targets/airoha/ 2>/dev/null || echo "No files found in airoha directory"
          echo "=== List all files in bin/targets/ ==="
          ls -la bin/targets/ 2>/dev/null || echo "No files found in targets directory"
          echo "=== List all files in bin/ ==="
          ls -la bin/ 2>/dev/null || echo "No files found in bin directory"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: gemtek-${{ inputs.config_seed }}-firmware
          path: |
            build.log
            build-verbose.log
            bin/targets/airoha/an7581/*.itb
            bin/targets/airoha/an7581/*manifest
            bin/targets/airoha/an7581/config.buildinfo
            bin/targets/airoha/an7581/feeds.buildinfo
            bin/targets/airoha/an7581/version.buildinfo
            bin/targets/airoha/an7581/sha256sums
          retention-days: 30
        if: always()

      - name: Build release body
        if: github.event.inputs.release_type != 'none'
        id: release_body
        env:
          RELEASE_NOTES: ${{ github.event.inputs.release_notes }}
        run: |
          {
            printf '%s\n' "$RELEASE_NOTES"
            echo ""
            echo "---"
            echo ""
            echo "如果您觉得对您有帮助，请我喝杯咖啡吧，让我更有动力持续更新。"
            echo ""
            echo '<img width="400" height="400" alt="c6ea388c976395326514814f80d512d5" src="https://github.com/user-attachments/assets/0ac90d58-ac73-4dc1-b926-276e539e5d0f" />'
          } > /tmp/release_body.md
          {
            echo "body<<EOF"
            cat /tmp/release_body.md
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Create Release
        if: github.event.inputs.release_type != 'none'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ format('{0}-{1}', steps.version.outputs.date, steps.version.outputs.repo_commit) }}
          name: ${{ format('{0} - Gemtek {1} Build ({2})', steps.version.outputs.date, steps.version.outputs.device_model, steps.version.outputs.repo_commit) }}
          body: ${{ steps.release_body.outputs.body }}
          draft: false
          prerelease: ${{ github.event.inputs.release_type == 'prerelease' }}
          files: |
            bin/targets/airoha/an7581/*.itb
            bin/targets/airoha/an7581/config.buildinfo
            bin/targets/airoha/an7581/feeds.buildinfo
            bin/targets/airoha/an7581/version.buildinfo
            bin/targets/airoha/an7581/sha256sums
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
